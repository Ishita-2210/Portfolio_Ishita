<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="parking-title parking-desc">
  <title id="parking-title">Dynamic Parking Pricing — illustrative study</title>
  <desc id="parking-desc">An abstract composition of flowing lime and lavender curves passing through concentric contours on a near-black field. Decorative study art; no measured data is represented.</desc>
