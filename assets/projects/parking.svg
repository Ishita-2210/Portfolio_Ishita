      <stop offset="1" stop-color="#D5FF68" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

