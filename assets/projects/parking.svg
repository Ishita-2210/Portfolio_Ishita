      <stop offset="0" stop-color="#D5FF68" stop-opacity="0.065"/>
      <stop offset="0.52" stop-color="#B9A4FF" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#080B0C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime-flow" x1="110" y1="430" x2="805" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D5FF68" stop-opacity="0.08"/>
      <stop offset="0.26" stop-color="#D5FF68" stop-opacity="0.65"/>
      <stop offset="0.58" stop-color="#F2F1E8"/>
      <stop offset="0.82" stop-color="#D5FF68" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D5FF68" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="lavender-flow" x1="105" y1="234" x2="795" y2="438" gradientUnits="userSpaceOnUse">
